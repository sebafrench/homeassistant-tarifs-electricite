title: Tarifs électricité
views:
  - title: Tarifs HP/HC
    path: tarifs-electricite
    icon: mdi:transmission-tower
    cards:
      - type: entities
        title: Tarif d'électricité en direct
        show_header_toggle: false
        entities:
          - entity: sensor.tarif_electricite_actuel
            name: Prix appliqué (EUR/kWh)
          - entity: sensor.periode_tarifaire
            name: Période actuelle
          - entity: sensor.prochain_changement_tarif
            name: Prochain changement
          - entity: select.mode_tarifaire
            name: Mode tarifaire
      - type: entities
        title: Prix modifiables
        show_header_toggle: false
        entities:
          - entity: number.tarif_hp
            name: Prix heures pleines
          - entity: number.tarif_hc
            name: Prix heures creuses
          - entity: number.tarif_revente_surplus
            name: Revente solaire
      - type: entities
        title: Informations complémentaires
        entities:
          - sensor.prix_kwh_heures_pleines
          - sensor.prix_kwh_heures_creuses
          - sensor.horaires_heures_creuses
          - sensor.prix_revente_surplus
      - type: markdown
        title: Plages horaires programmées
        content: >
          **Fuseau :** {{ state_attr('sensor.horaires_heures_creuses', 'fuseau_horaire') or 'non configuré' }}

          {% set jours_entiers = state_attr('sensor.horaires_heures_creuses', 'jours_entiers_hc') or [] %}
          {% if jours_entiers %}
          **Jours entièrement en HC :** {{ jours_entiers | join(', ') }} (00:00 → 00:00 lendemain)
          {% endif %}

          {% set plages = state_attr('sensor.horaires_heures_creuses', 'plages') or [] %}
          {% if plages | length == 0 %}
          Aucune plage HC horaire définie.{% if not jours_entiers %} Le tarif HP s'applique en automatique.{% else %} Les jours entiers en HC restent actifs.{% endif %}
          {% else %}
          {% for plage in plages %}
          - **{{ plage.jours }}** : {{ plage.debut }} → {{ plage.fin }}{% if plage.traverse_minuit %} (lendemain){% endif %}
          {% endfor %}
          {% endif %}
